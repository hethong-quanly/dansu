<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/theme.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Be Vietnam Pro', sans-serif; margin: 0; padding: 40px 16px; }
        .container { max-width: 500px; margin: auto; background: #ffffff; padding: 36px; border-radius: 16px; box-shadow: 0 12px 32px -18px rgba(28,22,18,.4); border: 1px solid #7eb3e6; }
        h2 { color: #ee1c25; text-align: center; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #7eb3e6; border-radius: 6px; font: inherit; }
        button { width: 100%; padding: 14px; background: #ee1c25; color: #ffffff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 15px; }
        .back { text-align: center; margin-top: 20px; }
        .back a { color: #ee1c25; font-weight: 600; }
        .error { color: #ee1c25; text-align: center; }
        .success { color: #2c6a4a; text-align: center; }
    </style>
</head>
<body class="vks-page">
    <div class="container">
        <h2>Đổi mật khẩu</h2>
        <div id="message" class="error"></div>
        <input type="password" id="old_pass" placeholder="Mật khẩu cũ">
        <input type="password" id="new_pass" placeholder="Mật khẩu mới">
        <input type="password" id="confirm_pass" placeholder="Nhập lại mật khẩu mới">
        <button onclick="changePassword()">Đổi mật khẩu</button>
        <div class="back"><a href="index.html">← Quay về Menu chính</a></div>
    </div>
    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyDunRDIeyBTVXTODoO22ywk1Q35cCx2sV8",
            authDomain: "dansu-vksndtpct.firebaseapp.com",
            databaseURL: "https://dansu-vksndtpct-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "dansu-vksndtpct",
            storageBucket: "dansu-vksndtpct.firebasestorage.app",
            appId: "1:843158256686:web:eb128d64c8b9bfd7aef3bf"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var db = firebase.database();
        var username = localStorage.getItem('vks_username') || localStorage.getItem('vks_user');
        if (!username || sessionStorage.getItem('vks_logged_in') !== 'true') {
            alert("Vui lòng đăng nhập trước!");
            window.location.href = "login.html";
        }
        function changePassword() {
            const oldPass = document.getElementById('old_pass').value.trim();
            const newPass = document.getElementById('new_pass').value.trim();
            const confirmPass = document.getElementById('confirm_pass').value.trim();
            const msg = document.getElementById('message');
            msg.textContent = '';
            msg.className = 'error';
            if (!oldPass || !newPass || !confirmPass) { msg.textContent = "Vui lòng nhập đầy đủ thông tin!"; return; }
            if (newPass !== confirmPass) { msg.textContent = "Mật khẩu mới không khớp!"; return; }
            if (newPass.length < 6) { msg.textContent = "Mật khẩu mới phải ít nhất 6 ký tự!"; return; }
            var local = {};
            try { local = JSON.parse(localStorage.getItem('vks_users_db') || '{}'); } catch (e) { local = {}; }
            function finish() {
                if (local[username]) {
                    local[username].password = newPass;
                    localStorage.setItem('vks_users_db', JSON.stringify(local));
                }
                msg.className = "success";
                msg.textContent = "Đổi mật khẩu thành công!";
                setTimeout(function () { window.location.href = "index.html"; }, 1600);
            }
            db.ref('users/' + username).once('value').then(function (snapshot) {
                const userData = snapshot.val();
                if (userData) {
                    if (userData.password !== oldPass) { msg.textContent = "Mật khẩu cũ không đúng!"; return; }
                    db.ref('users/' + username).update({ password: newPass }).then(finish);
                    return;
                }
                if (!local[username] || local[username].password !== oldPass) { msg.textContent = "Mật khẩu cũ không đúng!"; return; }
                finish();
            }).catch(function () {
                if (!local[username] || local[username].password !== oldPass) { msg.textContent = "Mật khẩu cũ không đúng!"; return; }
                finish();
            });
        }
    </script>
</body>
</html>
