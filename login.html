<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Đăng nhập hệ thống - VKSND TP. Cần Thơ</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="static/icon-192.png">
    <meta name="theme-color" content="#0a2468">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="VKS Dân sự">
    <script>
        (function(){try{var t=localStorage.getItem('vks-dansu-theme');if(t!=='dark'&&t!=='light')t='light';document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){}})();
    </script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="static/fb-key.js?v=20260917a"></script>
    <script src="static/rbac.js?v=20260921e"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root, [data-theme="light"] {
            --veil: linear-gradient(180deg, rgba(7,26,74,.48) 0%, rgba(10,36,104,.28) 38%, rgba(7,26,74,.82) 100%);
            --glass: rgba(255,255,255,.96);
            --ink: #122033;
            --muted: #5c6b80;
            --line: rgba(245,215,110,.45);
            --crimson: #0c3b8c;
            --fg: #ffffff;
            --brass: #f5d76e;
            --switch-bg: rgba(7,26,74,.78);
            --switch-on: #0c3b8c;
            --error: #b0000c;
        }
        [data-theme="dark"] {
            --veil: linear-gradient(180deg, rgba(4,14,36,.62) 0%, rgba(6,20,51,.42) 40%, rgba(4,14,36,.9) 100%);
            --glass: rgba(12,37,84,.92);
            --ink: #f4f7fb;
            --muted: #9db0d1;
            --line: rgba(245,215,110,.35);
            --crimson: #1a56c4;
            --fg: #ffffff;
            --brass: #ffe566;
            --switch-bg: rgba(4,14,36,.78);
            --switch-on: #1248ad;
            --error: #ff6b73;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; }
        body { font-family: 'Be Vietnam Pro', sans-serif; color: var(--fg); background: #071a4a; }
        .hero { position: relative; height: 100dvh; max-height: 100dvh; overflow: hidden; }
        .hq-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 38%; pointer-events: none; }
        .hq-veil { position: absolute; inset: 0; background: var(--veil); pointer-events: none; }
        .tech-grid {
            position: absolute; inset: 0; pointer-events: none; opacity: .2;
            background-image:
                radial-gradient(rgba(245,215,110,.28) 1px, transparent 1px),
                linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
            background-size: 32px 32px, 96px 96px, 96px 96px;
        }
        .theme-fab { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 30; }
        .theme-switch { display: inline-flex; height: 44px; overflow: hidden; border: 1px solid rgba(245,215,110,.45); border-radius: 12px; background: var(--switch-bg); }
        .theme-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 44px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 700; color: #ffe566; cursor: pointer; }
        .theme-btn svg { width: 16px; height: 16px; }
        .theme-btn[aria-pressed="true"] { background: var(--switch-on); color: #ffe566; }
        .center { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100dvh; max-height: 100dvh; padding: 48px 12px 10px; overflow: hidden; gap: 4px; }
        .logo-wrap { position: relative; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; }
        .ping-ring { display: none; }
        .logo { width: 60px; height: 60px; object-fit: contain; position: relative; z-index: 2; }
        @media (min-height: 820px) {
            .logo-wrap { width: 96px; height: 96px; }
            .logo { width: 84px; height: 84px; }
            .ping-ring { display: block; }
            .foot { display: block; }
        }
        @keyframes ping-ring { 0% { transform: translate(-50%, -50%) scale(.8); opacity: .5; } 100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } }
        .ping-ring { position: absolute; top: 50%; left: 50%; border-radius: 50%; pointer-events: none; animation: ping-ring 3.5s ease-out infinite; }
        .ping-ring:nth-child(1) { width: 140px; height: 140px; border: 2px solid rgba(245,215,110,.5); }
        .ping-ring:nth-child(2) { width: 118px; height: 118px; border: 2px solid rgba(245,215,110,.32); animation-delay: 1.2s; }
        .ping-ring:nth-child(3) { width: 96px; height: 96px; border: 2px solid rgba(245,215,110,.2); animation-delay: 2.4s; }
        .vks-gold { margin: 0; text-align: center; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; line-height: 1.3; color: #ffe566; text-shadow: 0 1px 0 #fff6c2, 1px 1px 0 #e8c675, 2px 2px 0 #c9952e, 3px 3px 0 #a67c1a, 4px 4px 0 #8a6414, 4px 6px 14px rgba(0,0,0,.5); max-width: 92vw; padding: 0 12px; }
        .app-title { margin: 2px 0 0; text-align: center; font-size: clamp(16px, 4vw, 24px); font-weight: 800; letter-spacing: .06em; color: #ffe566; text-shadow: 0 1px 0 #fff6c2, 1px 1px 0 #e8c675, 2px 2px 0 #c9952e, 3px 3px 8px rgba(0,0,0,.45); }
        .app-title span { background: linear-gradient(90deg, #fff6c2, #ffe566, #e8c675); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .app-title::after { content: ""; display: block; width: 72px; height: 3px; margin: 4px auto 0; border-radius: 99px; background: linear-gradient(90deg, transparent, #ffe566, transparent); }
        .glass { width: min(440px, 100%); margin-top: 8px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass); color: var(--ink); box-shadow: 0 20px 50px -24px rgba(7,26,74,.55); backdrop-filter: blur(14px); padding: 12px 14px 10px; }
        .glass h2 { margin: 0; font-size: 18px; font-weight: 700; color: #c9a227; }
        [data-theme="dark"] .glass h2 { color: #ffe566; }
        .glass p.lead { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
        label.field { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; font-size: 13px; font-weight: 600; }
        input { height: 38px; border-radius: 8px; border: 1px solid #d5deee; background: rgba(255,255,255,.85); color: inherit; padding: 0 12px; font: inherit; }
        [data-theme="dark"] input { background: rgba(4,14,36,.45); border-color: #1d4f8c; color: var(--ink); }
        input:focus { outline: 2px solid rgba(12,59,140,.4); border-color: var(--crimson); }
        .error { display: none; margin-top: 10px; font-size: 13px; color: var(--error); }
        .ok { display: none; margin-top: 10px; font-size: 13px; color: #2c6a4a; line-height: 1.5; }
        .btn-in { width: 100%; height: 40px; margin-top: 8px; border: 0; border-radius: 8px; background: #0c3b8c; color: #fff; font: inherit; font-weight: 800; letter-spacing: .08em; cursor: pointer; }
        .btn-in:hover { background: #1248ad; }
        .forgot { display: block; width: 100%; margin-top: 6px; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--crimson); cursor: pointer; text-align: center; }
        .forgot:hover { text-decoration: underline; }
        .install { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 36px; margin-top: 6px; border-radius: 8px; border: 1px solid rgba(201,162,39,.55); background: #071a4a; color: #ffe566; font: inherit; font-size: 12px; font-weight: 700; text-decoration: none; }
        .foot { display: none; margin-top: 8px; text-align: center; font-size: 11px; color: var(--muted); }
        @media (prefers-reduced-motion: reduce) { .ping-ring { animation: none; } }
    </style>
</head>
<body>
<div class="hero">
    <img class="hq-photo" src="static/tru-so-vksnd.jpg" alt="Trụ sở Viện kiểm sát nhân dân thành phố Cần Thơ">
    <div class="hq-veil"></div>
    <div class="tech-grid"></div>
    <div class="theme-fab">
        <div class="theme-switch" role="group" aria-label="Chọn giao diện">
            <button type="button" class="theme-btn" data-theme-set="light" aria-pressed="true" title="Giao diện sáng">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                <span>Sáng</span>
            </button>
            <button type="button" class="theme-btn" data-theme-set="dark" aria-pressed="false" title="Giao diện tối">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
                <span>Tối</span>
            </button>
        </div>
    </div>
    <div class="center">
        <div class="logo-wrap">
            <div class="ping-ring"></div>
            <div class="ping-ring"></div>
            <div class="ping-ring"></div>
            <img class="logo" src="static/logo_moi.png" alt="Phù hiệu Viện kiểm sát nhân dân">
        </div>
        <h2 class="vks-gold">Viện kiểm sát nhân dân thành phố Cần Thơ</h2>
        <h1 class="app-title">QUẢN LÝ <span>PHẦN DÂN SỰ</span></h1>

        <form class="glass" id="form-login" onsubmit="handleLogin(event)">
            <h2>Đăng nhập hệ thống</h2>
            <label class="field">Tên đăng nhập
                <input id="username" autocomplete="username">
            </label>
            <label class="field">Mật khẩu
                <input id="password" type="password" autocomplete="current-password">
            </label>
            <div class="error" id="error-msg"></div>
            <button type="submit" class="btn-in">ĐĂNG NHẬP</button>
            <button type="button" class="forgot" onclick="showForgot()">Quên mật khẩu?</button>
            <a class="install" data-install-app href="cai_dat.html">Cài đặt ứng dụng lên điện thoại</a>
            <p class="foot">Hệ thống Quản lý phần Dân sự · VKSND TP. Cần Thơ</p>
        </form>

        <form class="glass" id="form-forgot" style="display:none" onsubmit="handleForgot(event)">
            <h2>Quên mật khẩu</h2>
            <p class="lead">Nhập tên đăng nhập. Lãnh đạo đơn vị sẽ cấp lại mật khẩu trong mục Quản lý tài khoản.</p>
            <label class="field">Tên đăng nhập
                <input id="forgot-user" autocomplete="username">
            </label>
            <div class="error" id="forgot-error"></div>
            <div class="ok" id="forgot-ok"></div>
            <button type="submit" class="btn-in" id="forgot-btn">GỬI YÊU CẦU</button>
            <button type="button" class="forgot" onclick="showLogin()">Quay lại đăng nhập</button>
        </form>
    </div>
</div>
<script>
    var firebaseConfig = {
        apiKey: "AIzaSyDunRDIeyBTVXTODoO22ywk1Q35cCx2sV8",
        authDomain: "dansu-vksndtpct.firebaseapp.com",
        databaseURL: "https://dansu-vksndtpct-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "dansu-vksndtpct",
        storageBucket: "dansu-vksndtpct.firebasestorage.app",
        appId: "1:843158256686:web:eb128d64c8b9bfd7aef3bf"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.database();
    var ADMIN_PW = 'VKSNDTPCT';
    var TRIAL = ['vt.vksndtc','pvt.vksndtc','ctk.vksndtc','cb.vksndtc','cvp.cantho','cb.cantho','cvp.kv1','cb.kv1','cb.kv2','vt.hanoi','cb.hn1'];

    function rights() { return { p_dansu: true, p_khieuto: true, p_thihanh: true }; }

    function rightsFrom(extra) {
        extra = extra || {};
        if (window.VksRbac) {
            return VksRbac.rightsFor(extra.level, extra.position, extra.department || extra.departmentId || extra.phong);
        }
        return rights();
    }

    function seedLocal() {
        var dbLocal = {};
        try { dbLocal = JSON.parse(localStorage.getItem('vks_users_db') || '{}') || {}; } catch (e) { dbLocal = {}; }
        TRIAL.forEach(function (u) {
            if (dbLocal[u] && (dbLocal[u].password === '123456' || dbLocal[u].password === 'admin123')) delete dbLocal[u];
        });
        dbLocal.admin = Object.assign({}, dbLocal.admin || {}, {
            password: ADMIN_PW,
            fullname: (dbLocal.admin && dbLocal.admin.fullname) || 'Quản trị hệ thống',
            level: 'toi_cao',
            unit: 'VKSND Tối cao',
            position: 'Quản trị hệ thống',
            rank: 'quan_tri'
        }, rights());
        localStorage.setItem('vks_users_db', JSON.stringify(dbLocal));
        return dbLocal;
    }

    function scrubRemoteTrials() {
        db.ref('users/admin').once('value').then(function (snap) {
            var v = snap.val() || {};
            db.ref('users/admin').update(Object.assign({
                password: ADMIN_PW,
                fullname: v.fullname && !/viện trưởng|cục trưởng/i.test(v.fullname) ? v.fullname : 'Quản trị hệ thống',
                level: v.level || 'toi_cao',
                unit: v.unit || 'VKSND Tối cao',
                position: 'Quản trị hệ thống',
                rank: 'quan_tri'
            }, rights()));
        }).catch(function () {});
        TRIAL.forEach(function (u) {
            fbUserRef(db, u).once('value').then(function (s) {
                var v = s.val();
                if (v && (v.password === '123456' || v.password === 'admin123')) fbUserRef(db, u).remove();
            }).catch(function () {});
        });
    }

    function applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
        try { localStorage.setItem('vks-dansu-theme', t); } catch (e) {}
        document.querySelectorAll('[data-theme-set]').forEach(function (b) {
            b.setAttribute('aria-pressed', b.getAttribute('data-theme-set') === t ? 'true' : 'false');
        });
    }
    document.addEventListener('click', function (e) {
        var b = e.target.closest && e.target.closest('[data-theme-set]');
        if (!b) return;
        applyTheme(b.getAttribute('data-theme-set'));
    });
    applyTheme((function () { try { return localStorage.getItem('vks-dansu-theme') || 'light'; } catch (e) { return 'light'; } })());

    function profileOf(username, extra) {
        extra = extra || {};
        var computed = rightsFrom(extra);
        return Object.assign({
            username: username,
            fullname: extra.fullname || username,
            level: extra.level || '',
            unit: extra.unit || '',
            department: extra.department || extra.phong || '',
            departmentId: extra.departmentId || '',
            position: extra.position || ''
        }, extra, computed, { username: username });
    }

    function enter(username, extra) {
        var profile = profileOf(username, extra);
        sessionStorage.setItem('vks_logged_in', 'true');
        localStorage.setItem('vks_user', username);
        localStorage.setItem('vks_username', username);
        localStorage.setItem('vks_user_profile', JSON.stringify(profile));
        var local = seedLocal();
        local[username] = Object.assign({}, local[username] || {}, profile, { password: extra && extra.password ? extra.password : (local[username] && local[username].password) });
        localStorage.setItem('vks_users_db', JSON.stringify(local));
        window.location.href = 'index.html';
    }

    function showError(id, msg) {
        var el = document.getElementById(id);
        el.innerText = msg;
        el.style.display = 'block';
    }

    function handleLogin(e) {
        if (e) e.preventDefault();
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        if (!username || !password) { showError('error-msg', 'Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.'); return; }
        var local = seedLocal();
        fbUserRef(db, username).once('value').then(function (snap) {
            var remote = snap.val();
            if (remote) {
                if (remote.password !== password) { showError('error-msg', 'Mật khẩu không chính xác.'); return; }
                enter(username, remote);
                return;
            }
            var user = local[username];
            if (!user) { showError('error-msg', 'Tài khoản không tồn tại trên hệ thống.'); return; }
            if (user.password !== password) { showError('error-msg', 'Mật khẩu không chính xác.'); return; }
            enter(username, user);
        }).catch(function () {
            var user = local[username];
            if (!user || user.password !== password) { showError('error-msg', 'Không kết nối được máy chủ. Kiểm tra tài khoản hoặc mạng.'); return; }
            enter(username, user);
        });
    }

    function showForgot() {
        document.getElementById('form-login').style.display = 'none';
        document.getElementById('form-forgot').style.display = 'block';
        document.getElementById('forgot-user').value = document.getElementById('username').value;
        document.getElementById('forgot-error').style.display = 'none';
        document.getElementById('forgot-ok').style.display = 'none';
        document.getElementById('forgot-btn').style.display = 'block';
    }
    function showLogin() {
        document.getElementById('form-forgot').style.display = 'none';
        document.getElementById('form-login').style.display = 'block';
        document.getElementById('error-msg').style.display = 'none';
    }
    function handleForgot(e) {
        e.preventDefault();
        var username = document.getElementById('forgot-user').value.trim();
        document.getElementById('forgot-error').style.display = 'none';
        document.getElementById('forgot-ok').style.display = 'none';
        if (!username) { showError('forgot-error', 'Nhập tên đăng nhập.'); return; }
        var rec = { username: username, requestedAt: Date.now(), status: 'pending' };
        var local = [];
        try { local = JSON.parse(localStorage.getItem('vks_password_resets') || '[]'); } catch (err) { local = []; }
        local = local.filter(function (r) { return r.username !== username || r.status !== 'pending'; });
        local.unshift(rec);
        localStorage.setItem('vks_password_resets', JSON.stringify(local));
        db.ref('password_resets/' + fbUserKey(username)).set(rec).catch(function () {});
        document.getElementById('forgot-ok').innerText = 'Yêu cầu đã được ghi nhận. Liên hệ Viện trưởng hoặc Chánh văn phòng đơn vị để được cấp lại mật khẩu.';
        document.getElementById('forgot-ok').style.display = 'block';
        document.getElementById('forgot-btn').style.display = 'none';
    }

    window.onload = function () {
        seedLocal();
        scrubRemoteTrials();
        document.getElementById('username').focus();
    };
</script>
<script src="static/pwa.js?v=20260924c"></script>
</body>
</html>
