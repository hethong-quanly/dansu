<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Báo cáo Thống kê Tổng hợp</title>
    <link rel="stylesheet" href="static/theme.css?v=20260916c">
    <script src="static/rbac.js?v=20260921e"></script>
    <script src="static/pwa.js?v=20260924b"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0c3b8c;
            --primary-dark: #003d82;
            --accent: #ffffff;
            --green: #16a34a;
            --orange: #ea580c;
            --red: #dc2626;
            --bg: #e8f2fc;
            --white: #ffffff;
            --border: #e2e4f0;
            --text: #0c3b8c;
            --text-muted: #6b7280;
            --shadow: 0 2px 16px rgba(0,61,130,0.10);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--bg); color: var(--text); }

        header {
            background: #071a4a; color: #ffffff;
            padding: 14px 28px; display: flex; align-items: center; gap: 18px;
            box-shadow: 0 3px 14px rgba(0,61,130,0.3); position: sticky; top: 0; z-index: 100;
        }
        .btn-back {
            color: white; text-decoration: none; font-size: 13px; font-weight: 600;
            background: rgba(255,255,255,0.18); padding: 7px 15px; border-radius: 6px;
            white-space: nowrap; transition: background 0.2s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.3); }
        header h1 { font-size: 19px; font-weight: 700; flex: 1; text-align: center; color: #ffe566; }

        .container { max-width: 1300px; margin: 0 auto; padding: 28px 22px; }

        /* Filter bar */
        .filter-bar {
            background: var(--white); border-radius: 14px; padding: 20px 24px;
            box-shadow: var(--shadow); margin-bottom: 24px;
            display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap;
        }
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        select, input[type="date"] {
            padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px;
            font-family: inherit; font-size: 14px; color: var(--text); background: var(--bg);
            outline: none; transition: border-color 0.2s;
        }
        select:focus, input[type="date"]:focus { border-color: var(--primary); background: white; }
        .btn {
            padding: 11px 22px; border: none; border-radius: 8px; font-family: inherit;
            font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.18s;
            display: flex; align-items: center; gap: 7px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-green { background: var(--green); color: white; }
        .btn-green:hover { background: #15803d; }
        .btn-orange { background: var(--orange); color: white; }
        .btn-orange:hover { background: #c2410c; }

        /* KPI Cards */
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .kpi-card {
            background: var(--white); border-radius: 14px; padding: 20px 22px;
            box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px;
            border-left: 4px solid transparent; transition: transform 0.18s;
        }
        .kpi-card:hover { transform: translateY(-2px); }
        .kpi-card.blue { border-color: var(--primary); }
        .kpi-card.green { border-color: var(--green); }
        .kpi-card.orange { border-color: var(--orange); }
        .kpi-card.red { border-color: var(--red); }
        .kpi-icon { font-size: 32px; }
        .kpi-info .num { font-size: 30px; font-weight: 700; line-height: 1; }
        .kpi-info .blue .num { color: var(--primary); }
        .kpi-card.blue .num { color: var(--primary); }
        .kpi-card.green .num { color: var(--green); }
        .kpi-card.orange .num { color: var(--orange); }
        .kpi-card.red .num { color: var(--red); }
        .kpi-info .lbl { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
        .kpi-info .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* Charts */
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .chart-card {
            background: var(--white); border-radius: 14px; padding: 22px;
            box-shadow: var(--shadow);
        }
        .chart-card h3 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 18px; }
        .chart-wrap { position: relative; height: 240px; }

        /* Table */
        .table-card {
            background: var(--white); border-radius: 14px; padding: 22px;
            box-shadow: var(--shadow); margin-bottom: 24px;
        }
        .table-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .table-header h3 { font-size: 15px; font-weight: 700; color: var(--text); }
        .badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-blue { background: #dbeafe; color: #1d4ed8; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead th {
            background: #e8f2fc; color: var(--primary); font-weight: 700;
            padding: 11px 13px; text-align: left; border-bottom: 2px solid var(--border);
        }
        tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
        tbody tr:hover { background: #f9faff; }
        tbody td { padding: 10px 13px; vertical-align: top; }
        .status-pill {
            display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
        }
        .sp-so-tham { background: #dbeafe; color: #1d4ed8; }
        .sp-phuc-tham { background: #fef9c3; color: #854d0e; }
        .sp-gdt { background: #f3e8ff; color: #7e22ce; }

        /* Loading */
        .loading {
            text-align: center; padding: 60px 20px; color: var(--text-muted);
            display: flex; flex-direction: column; align-items: center; gap: 14px;
        }
        .spinner {
            width: 42px; height: 42px; border: 4px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }

        /* Summary detail table */
        .summary-section { margin-bottom: 24px; }
        .summary-section h3 { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .summary-card {
            background: var(--white); border-radius: 12px; padding: 16px 18px;
            box-shadow: var(--shadow); border-top: 3px solid var(--primary);
        }
        .summary-card h4 { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
        .summary-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .summary-row:last-child { border-bottom: none; }
        .summary-row .val { font-weight: 700; color: var(--primary); }

        @media (max-width: 900px) {
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
            .summary-grid { grid-template-columns: 1fr; }
            .filter-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body class="vks-page">
<header>
    <a href="index.html" class="btn-back">← Menu chính</a>
    <h1>📊 BÁO CÁO THỐNG KÊ TỔNG HỢP</h1>
</header>

<div class="container">
    <!-- Filter bar -->
    <div class="filter-bar">
        <div class="filter-group">
            <label>Loại báo cáo</label>
            <select id="reportType">
                <option value="all">Tất cả nghiệp vụ</option>
                <option value="an_dan_su">Án Dân sự</option>
                <option value="thi_hanh_an">Thi hành án</option>
                <option value="don_khieu_to">Khiếu nại - Tố cáo</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Thời gian</label>
            <select id="periodType" onchange="toggleCustomDate()">
                <option value="week">Tuần này</option>
                <option value="month">Tháng này</option>
                <option value="half">06 tháng</option>
                <option value="year" selected>Năm nay</option>
                <option value="custom">Tùy chọn</option>
            </select>
        </div>
        <div id="customDateGroup" style="display:none; gap:8px;" class="filter-group">
            <label>Từ ngày → Đến ngày</label>
            <div style="display:flex;gap:8px;">
                <input type="date" id="fromDate">
                <input type="date" id="toDate">
            </div>
        </div>
        <button class="btn btn-primary" onclick="loadReport()">🔍 Xem báo cáo</button>
        <button class="btn btn-green" onclick="exportExcel()">📥 Xuất Excel</button>
    </div>

    <!-- KPI -->
    <div class="kpi-grid" id="kpi-section">
        <div class="loading" style="grid-column:1/-1; padding:30px;">
            <div class="spinner"></div><span>Đang tải dữ liệu...</span>
        </div>
    </div>

    <div class="table-card" id="kpi287-card" style="display:none;margin-bottom:18px;">
        <div class="table-header">
            <h3>Đánh giá KPI QĐ 287 — mục II, III, V, VI, VII</h3>
        </div>
        <div id="kpi287" style="padding:12px 16px;overflow:auto;"></div>
    </div>

    <!-- Charts -->
    <div class="charts-grid" id="charts-section" style="display:none;">
        <div class="chart-card">
            <h3>📊 Phân loại theo nghiệp vụ</h3>
            <div class="chart-wrap"><canvas id="chartDonut"></canvas></div>
        </div>
        <div class="chart-card">
            <h3>📈 Án dân sự theo cấp xét xử</h3>
            <div class="chart-wrap"><canvas id="chartBar"></canvas></div>
        </div>
    </div>

    <!-- Summary cards -->
    <div class="summary-section" id="summary-section" style="display:none;">
        <h3>📋 Thống kê chi tiết từng nghiệp vụ</h3>
        <div class="summary-grid" id="summary-grid"></div>
    </div>

    <!-- Detail table -->
    <div class="table-card">
        <div class="table-header">
            <h3>📄 Danh sách hồ sơ chi tiết</h3>
            <span class="badge badge-blue" id="record-count">0 hồ sơ</span>
        </div>
        <div id="table-area">
            <div class="loading"><div class="spinner"></div><span>Đang tải...</span></div>
        </div>
    </div>
</div>

<script>
    // ===== FIREBASE =====
    var firebaseConfig = {
        apiKey: "AIzaSyDunRDIeyBTVXTODoO22ywk1Q35cCx2sV8",
        authDomain: "dansu-vksndtpct.firebaseapp.com",
        databaseURL: "https://dansu-vksndtpct-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "dansu-vksndtpct",
        storageBucket: "dansu-vksndtpct.firebasestorage.app",
        appId: "1:843158256686:web:eb128d64c8b9bfd7aef3bf"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    let currentUser = {};
    let allData = { an_dan_su: [], thi_hanh_an: [], don_khieu_to: [] };
    let exportData = [];
    let chartDonut, chartBar;

    function parseCurrentUser() {
        const raw = localStorage.getItem('vks_user');
        if (!raw) return null;
        let user = null;
        try {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') user = parsed;
            else if (typeof parsed === 'string') user = { username: parsed };
        } catch (e) {
            user = { username: raw };
        }
        if (!user || !user.username) user = { username: raw };
        try {
            const usersDB = JSON.parse(localStorage.getItem('vks_users_db') || '{}');
            const profile = usersDB[user.username];
            if (profile && typeof profile === 'object') {
                user = Object.assign({ username: user.username, fullname: profile.fullname, level: profile.level, unit: profile.unit }, profile, user);
            }
        } catch (e) {}
        return user;
    }

    function checkLogin() {
        const logged = sessionStorage.getItem('vks_logged_in') === 'true';
        currentUser = (window.VksRbac ? VksRbac.parseProfile() : parseCurrentUser()) || {};
        if (!logged || !currentUser.username) {
            alert("Vui lòng đăng nhập trước!");
            window.location.href = "login.html";
            return false;
        }
        restrictReportOptions();
        return true;
    }

    function restrictReportOptions() {
        var sel = document.getElementById('reportType');
        if (!sel || !window.VksRbac) return;
        var u = currentUser;
        if (VksRbac.isFullModuleAccess(u)) return;
        var keep = [];
        if (VksRbac.canAccessModule(u, 'dansu')) keep.push('an_dan_su');
        if (VksRbac.canAccessModule(u, 'thads')) keep.push('thi_hanh_an');
        if (VksRbac.canAccessModule(u, 'khieuto')) keep.push('don_khieu_to');
        Array.from(sel.options).forEach(function (opt) {
            if (opt.value === 'all' || keep.indexOf(opt.value) < 0) opt.remove();
        });
        if (keep.length && keep.indexOf(sel.value) < 0) sel.value = keep[0];
    }

    function toggleCustomDate() {
        const v = document.getElementById('periodType').value;
        document.getElementById('customDateGroup').style.display = v === 'custom' ? 'flex' : 'none';
    }

    // ===== TIME FILTER =====
    function getTimeRange() {
        const period = document.getElementById('periodType').value;
        const now = new Date();
        let from = 0, to = Infinity;
        if (period === 'week') {
            const day = now.getDay();
            const mondayOffset = day === 0 ? -6 : 1 - day;
            const fromDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + mondayOffset);
            from = fromDate.getTime();
            to = from + 7 * 86400000 - 1;
        } else if (period === 'month') {
            from = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
            to = new Date(now.getFullYear(), now.getMonth()+1, 0, 23, 59, 59).getTime();
        } else if (period === 'half') {
            const first = now.getMonth() < 6;
            from = new Date(now.getFullYear(), first ? 0 : 6, 1).getTime();
            to = new Date(now.getFullYear(), first ? 6 : 12, 0, 23, 59, 59).getTime();
        } else if (period === 'year') {
            from = new Date(now.getFullYear(), 0, 1).getTime();
            to = new Date(now.getFullYear(), 11, 31, 23, 59, 59).getTime();
        } else if (period === 'custom') {
            const f = document.getElementById('fromDate').value;
            const t = document.getElementById('toDate').value;
            if (f) from = new Date(f).getTime();
            if (t) to = new Date(t).getTime() + 86399000;
        }
        return { from, to };
    }

    function itemTime(item) {
        if (item.timestamp) return Number(item.timestamp);
        const d = item.ngay_thu_ly || item.ngay_nhan_qd || item.ngay_nhan || item.ngay_ghi || item.createdAt || '';
        if (!d) return 0;
        const t = new Date(d).getTime();
        return isNaN(t) ? 0 : t;
    }

    function passTimeFilter(item, from, to) {
        if (from === 0 && to === Infinity) return true;
        const ts = itemTime(item);
        return ts >= from && ts <= to;
    }

    function canView(item) {
        if (window.VksRbac) return VksRbac.canSeeRecord(currentUser, item);
        if (!currentUser.level) return true;
        if (currentUser.level === 'toi_cao') return true;
        if (item.unit && item.unit === currentUser.unit) return true;
        if (item.createdBy && item.createdBy === currentUser.username) return true;
        return false;
    }

    // ===== LOAD DATA =====
    async function loadIndexedDansu() {
        return new Promise(function (resolve) {
            try {
                var req = indexedDB.open('VKS_AN_DAN_SU', 2);
                req.onerror = function () { resolve([]); };
                req.onsuccess = function (e) {
                    var idb = e.target.result;
                    if (!idb.objectStoreNames.contains('records')) { resolve([]); return; }
                    var r = idb.transaction('records').objectStore('records').getAll();
                    r.onsuccess = function () { resolve(r.result || []); };
                    r.onerror = function () { resolve([]); };
                };
            } catch (err) { resolve([]); }
        });
    }

    async function loadAllData() {
        async function getSnap(path) {
            const snap = await db.ref(path).once('value');
            const val = snap.val() || {};
            return Object.entries(val).map(([k, v]) => ({ _key: k, ...v }));
        }
        const [ads, tha, dkt, idb] = await Promise.all([
            getSnap('an_dan_su'),
            getSnap('thi_hanh_an'),
            getSnap('don_khieu_to'),
            loadIndexedDansu()
        ]);
        const byKey = {};
        ads.forEach(function (x) { byKey[x.ma_vu_viec || x._key] = x; });
        idb.forEach(function (x) {
            var k = x.ma_vu_viec || ('idb-' + x.id);
            byKey[k] = Object.assign({}, byKey[k] || {}, x);
        });
        allData = { an_dan_su: Object.keys(byKey).map(function (k) { return byKey[k]; }), thi_hanh_an: tha, don_khieu_to: dkt };
    }

    function renderKpi287(ads, tha, dkt) {
        var level = (currentUser.level === 'toi_cao' || currentUser.level === 'khuvuc' || currentUser.level === 'tinh') ? currentUser.level : 'tinh';
        var cur = null;
        function itemLevel(x) {
            var lv = String((x && (x.ownerLevel || x.level)) || '');
            if (lv === 'toi_cao' || lv === 'tinh' || lv === 'khuvuc') return lv;
            var unit = String((x && (x.unit_label || x.unit || x.department || x.departmentId)) || '');
            if (/khu vực|KV\s*\d|kv\d/i.test(unit)) return 'khuvuc';
            if (/tối cao|vu_9|vu_10|vu_11|vu_12/i.test(unit)) return 'toi_cao';
            if (x && x.regionId && !x.departmentId) return 'khuvuc';
            return level;
        }
        function band(tc, tinh, kv) {
            var lv = itemLevel(cur || {});
            if (lv === 'toi_cao') return tc;
            if (lv === 'khuvuc') return kv == null ? 0 : kv;
            return tinh;
        }
        function on(v) { return v === true || v === 1 || v === '1' || v === 'true'; }
        function num(v) { var n = Number(v); return isFinite(n) && n > 0 ? Math.round(n) : 0; }
        function muc(v) { var n = Math.round(Number(v) || 1); if (n < 1) n = 1; if (n > 4) n = 4; return n - 1; }
        function done(x) {
            var st = String(x.status || '');
            return st === 'da_xet_xu' || st === 'dinh_chi' || st === 'khang_nghi' || !!(x.judgmentDate || x.ngay_ban_hanh || x.courtResult);
        }
        var groups = {};
        function deptPretty(d) {
            var s = String(d || '');
            var m = s.match(/(phong|phòng|vu|vụ)[_\s]*(\d+)/i);
            if (m) return (/vu|vụ/i.test(m[1]) ? 'Vụ ' : 'Phòng ') + m[2];
            if (/thanh tra/i.test(s)) return 'Thanh tra';
            return s;
        }
        function unitMeta(x) {
            var lv = itemLevel(x);
            var unit = String((x && (x.unit_label || x.unit)) || '');
            var dept = String((x && (x.department || x.phong || x.departmentId)) || '');
            var viewer = currentUser || {};
            var viewerWide = window.VksRbac && VksRbac.isUnitWide ? VksRbac.isUnitWide(viewer) : (viewer.level === 'toi_cao' || viewer.username === 'admin');
            if (!dept && !viewerWide && viewer.level !== 'khuvuc') dept = String(viewer.department || viewer.phong || viewer.departmentId || '');
            if (!unit) {
                if (lv === 'khuvuc') unit = String(viewer.unit || viewer.unit_label || 'VKSND khu vực');
                else if (lv === 'toi_cao') unit = 'VKSND tối cao';
                else unit = 'VKSND TP. Cần Thơ';
            }
            var label = unit;
            if (lv !== 'khuvuc' && dept && !/khu\s*vực/i.test(unit)) label = unit + ' · ' + deptPretty(dept);
            return { key: lv + '|' + label, label: label, level: lv };
        }
        function ensureGroup(x) {
            var meta = unitMeta(x);
            if (!groups[meta.key]) groups[meta.key] = { label: meta.label, level: meta.level, lines: {} };
            return groups[meta.key];
        }
        function add(id, label, hint, times, pts) {
            var g = ensureGroup(cur || {});
            if (!g.lines[id]) g.lines[id] = { id: id, label: label, hint: hint, count: 0, points: 0 };
            if (times > 0) { g.lines[id].count += times; g.lines[id].points += pts * times; }
        }
        var II = {
            stV: [100,200,300,500], stE: [50,100,150,250],
            ptV: [150,250,350,600], ptE: [75,125,175,300],
            g0: [100,200,300,500], g1: [200,300,500,1000], g2: [120,250,350,600]
        };
        var III = { a: [100,200,300,500], b: [100,150,250,300], c: [100,200,300,500] };
        ads.forEach(function (x) {
            cur = x;
            var i = muc(x.kpiLevel);
            var viec = x.recordKind === 'viec';
            var trial = String(x.trialLevel || x.cap_thu_ly || x.cap_xet_xu || '').toLowerCase();
            var tai = trial.indexOf('tai_tham') >= 0 || trial.indexOf('tái') >= 0 || trial.indexOf('tai tham') >= 0;
            var gdt = tai || trial.indexOf('giam') >= 0 || trial.indexOf('giám') >= 0 || trial.indexOf('gđt') >= 0 || trial.indexOf('gdt') >= 0;
            var pt = trial.indexOf('phuc') >= 0 || trial.indexOf('phúc') >= 0;
            if (x.kpiTrack === 'khoi_kien') {
                if (on(x.kkTiepNhan)) add('III.1', 'Khởi kiện — tiếp nhận, xác minh', '100/200/300/500', 1, III.a[i]);
                if (on(x.kkSoTham)) add('III.2', 'Khởi kiện — sơ thẩm', '100/150/250/300', 1, III.b[i]);
                if (on(x.kkPhucTham)) add('III.3', 'Khởi kiện — phúc thẩm/GĐT', '100/200/300/500', 1, III.c[i]);
            } else if (done(x)) {
                if (gdt) {
                    if (x.gdtProduct === 'don_co_kn') add('II.3b', 'Đơn GĐT có kháng nghị', '200/300/500/1000', 1, II.g1[i]);
                    else if (x.gdtProduct === 'xet_xu') add('II.3c', 'Xét xử GĐT xong', '120/250/350/600', 1, II.g2[i]);
                    else if (x.gdtProduct === 'don_khong_kn') add('II.3a', 'Đơn GĐT không kháng nghị', '100/200/300/500', 1, II.g0[i]);
                } else if (pt) add('II.2', 'Xét xử phúc thẩm', 'Vụ 150–600 · Việc 75–300', 1, (viec ? II.ptE : II.ptV)[i]);
                else add('II.1', 'Giải quyết sơ thẩm', 'Vụ 100–500 · Việc 50–250', 1, (viec ? II.stE : II.stV)[i]);
            }
            if (on(x.khangNghiPT) || on(x.kpiKhangNghiPt) || x.protestKind === 'phuc_tham' || x.kn_loai === 'Phúc thẩm') add('VII.1', 'Kháng nghị phúc thẩm', '250/200/150', 1, band(250, 200, 150));
            if (on(x.khangNghiGdt) || on(x.kpiKhangNghiGdt) || x.protestKind === 'giam_doc_tham' || x.protestKind === 'tai_tham' || x.kn_loai === 'Giám đốc thẩm' || x.kn_loai === 'Tái thẩm') add('VII.2', 'Kháng nghị GĐT/TT', '300/250 · khu vực không chấm', 1, band(300, 250, null));
            if (on(x.kienNghi) && x.kienNghiType === 'tong_hop') add('VII.4', 'Kiến nghị tổng hợp', '150/100/80', 1, band(150, 100, 80));
            else if (on(x.kienNghi) || on(x.kpiKienNghiVu)) add('VII.3', 'Kiến nghị theo vụ việc', '100/80/60', 1, band(100, 80, 60));
            if (on(x.experienceNotice) || on(x.kpiExperienceNotice)) add('VII.5', 'Thông báo rút kinh nghiệm', '150/100 · khu vực không chấm', 1, band(150, 100, null));
            if (on(x.guidanceReply) || on(x.kpiGuidanceReply)) add('VII.6', 'Trả lời thỉnh thị', '200/150 · khu vực không chấm', 1, band(200, 150, null));
            if (on(x.professionalExchange) || on(x.kpiExchange)) add('VII.7', 'Trao đổi nghiệp vụ', '50/50/50', 1, band(50, 50, 50));
        });
        dkt.forEach(function (x) {
            cur = x;
            var turns = num(x.receptionTurns) || (on(x.leaderReception) ? 1 : 0);
            if (turns) add('VI.1.1', 'Tiếp công dân', '10/8/5 mỗi lượt', turns, band(10, 8, 5));
            var loai = x.authority === 'khong_thuoc' || on(x.duplicate);
            if (loai) add('VI.1.2', 'Đơn không thuộc TQ / đơn trùng', '5/3/2', 1, band(5, 3, 2));
            var xong = x.status === 'da_giai_quyet' || !!(x.decisionDate || x.ket_qua_ngay);
            if (xong && !loai) {
                if (x.resolveMode === 'doan') add('VI.2.2', 'Đơn phức tạp — Đoàn xác minh', '300/200/150', 1, band(300, 200, 150));
                else if (x.resolveMode === 'kiem_tra_lai') add('VI.2.3', 'Kiểm tra lại quyết định', '200/150/100', 1, band(200, 150, 100));
                else add('VI.2.1', 'Giải quyết đơn thông thường', '150/100/70', 1, band(150, 100, 70));
            }
            if (num(x.inspectRounds)) add('VI.3.1', 'TTKS giải quyết KN/TC', '500/300/200', num(x.inspectRounds), band(500, 300, 200));
            if (num(x.reviewRounds)) add('VI.3.2', 'Phúc tra KN/TC', '200/120/60', num(x.reviewRounds), band(200, 120, 60));
        });
        var months = {};
        tha.forEach(function (x) {
            cur = x;
            if (num(x.inspectRounds)) add('V.1', 'Trực tiếp kiểm sát THADS', '600/360/180 mỗi cuộc', num(x.inspectRounds), band(600, 360, 180));
            var files = num(x.complaintFiles) || (on(x.complaintTha) ? 1 : 0);
            if (files) add('V.2', 'Hồ sơ KN/TC về THADS', '100/60/30', files, band(100, 60, 30));
            if (num(x.reviewRounds)) add('V.3', 'Phúc tra THADS', '200/120/60', num(x.reviewRounds), band(200, 120, 60));
            if (num(x.monthlyReports)) add('V.4', 'Số liệu chuyên đề THADS', '100/60/30 mỗi tháng', num(x.monthlyReports), band(100, 60, 30));
            else if (on(x.monthlyNoticeSent)) {
                var key = unitMeta(x).key + '|' + String(x.receivedDate || x.ngay_nhan || '').slice(0, 7);
                if (!months[key]) { months[key] = 1; add('V.4', 'Số liệu chuyên đề THADS', '100/60/30 mỗi tháng', 1, band(100, 60, 30)); }
            }
            if (on(x.kienNghi)) add('VII.3', 'Kiến nghị theo vụ việc', '100/80/60', 1, band(100, 80, 60));
        });
        function escK(s) {
            return String(s || '').replace(/&/g, '&' + 'amp;').replace(/</g, '<').replace(/>/g, '>');
        }
        var order = ['II.1','II.2','II.3a','II.3b','II.3c','III.1','III.2','III.3','V.1','V.2','V.3','V.4','VI.1.1','VI.1.2','VI.2.1','VI.2.2','VI.2.3','VI.3.1','VI.3.2','VII.1','VII.2','VII.3','VII.4','VII.5','VII.6','VII.7'];
        var keys = Object.keys(groups).sort(function (a, b) { return groups[a].label.localeCompare(groups[b].label, 'vi'); });
        if (!keys.length) keys = ['__empty'];
        document.getElementById('kpi287-card').style.display = 'block';
        document.getElementById('kpi287').innerHTML = '<p style="margin:0 0 8px;font-size:13px;">Mỗi đơn vị được chấm riêng trên hồ sơ do chính đơn vị nhập. Phòng 9 không cộng điểm với Phòng 10 hay khu vực. Hồ sơ chưa chọn mức phức tạp được tính mức 1. Mục I hình sự và mục IV giam giữ, thi hành án hình sự không chấm cho dân sự, THADS, khiếu tố.</p>' +
            keys.map(function (key) {
                var g = groups[key] || { label: (currentUser.unit_label || currentUser.unit || 'Đơn vị'), lines: {} };
                var rows = order.filter(function (id) { return g.lines[id]; }).map(function (id) { return g.lines[id]; });
                var total = rows.reduce(function (s, r) { return s + r.points; }, 0);
                return '<h3 style="margin:14px 0 6px;font-size:15px;">' + escK(g.label) + ' — <b>' + total + '</b> điểm</h3>' +
                    '<table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px;"><thead><tr style="background:#0c3b8c;color:#fff;"><th style="text-align:left;padding:8px;">Mục</th><th style="text-align:left;padding:8px;">Tiêu chí</th><th style="padding:8px;">Khung</th><th style="padding:8px;">Số SP</th><th style="padding:8px;">Điểm</th></tr></thead><tbody>' +
                    (rows.length ? rows.map(function (r) {
                        return '<tr><td style="padding:6px 8px;border-bottom:1px solid #e5e7eb;">' + r.id + '</td><td style="padding:6px 8px;border-bottom:1px solid #e5e7eb;">' + r.label + '</td><td style="padding:6px 8px;border-bottom:1px solid #e5e7eb;">' + r.hint + '</td><td style="padding:6px 8px;text-align:right;border-bottom:1px solid #e5e7eb;">' + r.count + '</td><td style="padding:6px 8px;text-align:right;border-bottom:1px solid #e5e7eb;"><b>' + r.points + '</b></td></tr>';
                    }).join('') : '<tr><td colspan="5" style="padding:12px;">Chưa có sản phẩm được chấm trong kỳ này.</td></tr>') +
                    '</tbody></table>';
            }).join('');
    }

    // ===== RENDER =====
    async function loadReport() {
        // Show loading
        document.getElementById('kpi-section').innerHTML = `<div class="loading" style="grid-column:1/-1;padding:30px;"><div class="spinner"></div><span>Đang tải dữ liệu...</span></div>`;
        document.getElementById('table-area').innerHTML = `<div class="loading"><div class="spinner"></div><span>Đang tải...</span></div>`;
        document.getElementById('charts-section').style.display = 'none';
        document.getElementById('summary-section').style.display = 'none';

        if (!checkLogin()) return;
        await loadAllData();

        const reportType = document.getElementById('reportType').value;
        const { from, to } = getTimeRange();

        // Filter data by type, time, permission
        function filter(arr) {
            return arr.filter(item => canView(item) && passTimeFilter(item, from, to));
        }

        const filteredAds = (reportType === 'all' || reportType === 'an_dan_su') ? filter(allData.an_dan_su) : [];
        const filteredTha = (reportType === 'all' || reportType === 'thi_hanh_an') ? filter(allData.thi_hanh_an) : [];
        const filteredDkt = (reportType === 'all' || reportType === 'don_khieu_to') ? filter(allData.don_khieu_to) : [];
        const total = filteredAds.length + filteredTha.length + filteredDkt.length;

        // ===== KPI CARDS =====
        document.getElementById('kpi-section').innerHTML = `
            <div class="kpi-card blue">
                <div class="kpi-icon">⚖️</div>
                <div class="kpi-info">
                    <div class="num" style="color:var(--primary)">${filteredAds.length}</div>
                    <div class="lbl">Án Dân sự</div>
                    <div class="sub">Tổng toàn hệ thống: ${allData.an_dan_su.length}</div>
                </div>
            </div>
            <div class="kpi-card green">
                <div class="kpi-icon">📋</div>
                <div class="kpi-info">
                    <div class="num" style="color:var(--green)">${filteredTha.length}</div>
                    <div class="lbl">Thi hành án</div>
                    <div class="sub">Tổng toàn hệ thống: ${allData.thi_hanh_an.length}</div>
                </div>
            </div>
            <div class="kpi-card orange">
                <div class="kpi-icon">📨</div>
                <div class="kpi-info">
                    <div class="num" style="color:var(--orange)">${filteredDkt.length}</div>
                    <div class="lbl">Khiếu nại - Tố cáo</div>
                    <div class="sub">Tổng toàn hệ thống: ${allData.don_khieu_to.length}</div>
                </div>
            </div>
            <div class="kpi-card red">
                <div class="kpi-icon">📁</div>
                <div class="kpi-info">
                    <div class="num" style="color:var(--red)">${total}</div>
                    <div class="lbl">Tổng hồ sơ</div>
                    <div class="sub">Theo bộ lọc hiện tại</div>
                </div>
            </div>
        `;
        renderKpi287(filteredAds, filteredTha, filteredDkt);

        // ===== BIỂU ĐỒ =====
        if (total > 0) {
            document.getElementById('charts-section').style.display = 'grid';

            // Donut chart
            if (chartDonut) chartDonut.destroy();
            const ctxD = document.getElementById('chartDonut').getContext('2d');
            chartDonut = new Chart(ctxD, {
                type: 'doughnut',
                data: {
                    labels: ['Án Dân sự', 'Thi hành án', 'Khiếu nại - Tố cáo'],
                    datasets: [{
                        data: [filteredAds.length, filteredTha.length, filteredDkt.length],
                        backgroundColor: ['#0c3b8c', '#16a34a', '#ea580c'],
                        borderWidth: 2, borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { family: 'Be Vietnam Pro', size: 12 } } }
                    }
                }
            });

            // Bar chart - án dân sự theo cấp
            const capCount = {};
            filteredAds.forEach(x => {
                const c = x.cap_thu_ly || 'Không rõ';
                capCount[c] = (capCount[c]||0) + 1;
            });
            if (chartBar) chartBar.destroy();
            const ctxB = document.getElementById('chartBar').getContext('2d');
            chartBar = new Chart(ctxB, {
                type: 'bar',
                data: {
                    labels: Object.keys(capCount).length ? Object.keys(capCount) : ['Chưa có dữ liệu'],
                    datasets: [{
                        label: 'Số vụ',
                        data: Object.values(capCount).length ? Object.values(capCount) : [0],
                        backgroundColor: ['#0c3b8c', '#6366f1', '#818cf8', '#c7d2fe'],
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        // ===== SUMMARY CARDS =====
        const capCount = {};
        filteredAds.forEach(x => { const c = x.cap_thu_ly||'Khác'; capCount[c]=(capCount[c]||0)+1; });

        const kqCount = {};
        filteredAds.forEach(x => { const k = x.ket_qua_xet_xu||'Chưa có'; kqCount[k]=(kqCount[k]||0)+1; });

        document.getElementById('summary-section').style.display = 'block';
        document.getElementById('summary-grid').innerHTML = `
            <div class="summary-card">
                <h4>⚖️ Án Dân sự theo cấp xét xử</h4>
                ${Object.entries(capCount).length ? Object.entries(capCount).map(([k,v])=>`
                    <div class="summary-row"><span>${k}</span><span class="val">${v} vụ</span></div>
                `).join('') : '<div class="summary-row"><span style="color:var(--text-muted)">Không có dữ liệu</span></div>'}
                <div class="summary-row" style="font-weight:700; border-top:2px solid var(--primary);">
                    <span>Tổng cộng</span><span class="val">${filteredAds.length} vụ</span>
                </div>
            </div>
            <div class="summary-card" style="border-top-color:var(--green)">
                <h4>📋 Thi hành án</h4>
                ${buildThaStats(filteredTha)}
                <div class="summary-row" style="font-weight:700; border-top:2px solid var(--green);">
                    <span>Tổng cộng</span><span class="val" style="color:var(--green)">${filteredTha.length} hồ sơ</span>
                </div>
            </div>
            <div class="summary-card" style="border-top-color:var(--orange)">
                <h4>📨 Khiếu nại - Tố cáo</h4>
                ${buildDktStats(filteredDkt)}
                <div class="summary-row" style="font-weight:700; border-top:2px solid var(--orange);">
                    <span>Tổng cộng</span><span class="val" style="color:var(--orange)">${filteredDkt.length} đơn</span>
                </div>
            </div>
        `;

        // ===== DETAIL TABLE =====
        exportData = [];
        let rows = '';
        let stt = 1;

        // Án dân sự
        if (filteredAds.length && (reportType === 'all' || reportType === 'an_dan_su')) {
            filteredAds.forEach(item => {
                const capClass = {
                    'So tham': 'sp-so-tham',
                    'Phuc tham': 'sp-phuc-tham',
                    'Giam doc tham': 'sp-gdt',
                    'Tai tham': 'sp-gdt'
                }[item.cap_thu_ly] || 'sp-so-tham';

                const tomTat = (item.noi_dung || item.noi_dung_so_tham || '—').substring(0, 70);
                rows += `<tr>
                    <td>${stt++}</td>
                    <td><span class="status-pill ${capClass}">${item.cap_thu_ly||'ST'}</span></td>
                    <td>Án dân sự</td>
                    <td>${item.ngay_thu_ly||'—'}</td>
                    <td>${item.tham_phan||'—'}</td>
                    <td>${item.ksv||'—'}</td>
                    <td>${tomTat}${tomTat.length===70?'...':''}</td>
                    <td>${item.ket_qua_xet_xu||'—'}</td>
                    <td>${item.createdBy||'—'}</td>
                </tr>`;
                exportData.push({ STT: stt-1, LoaiCapXetXu: item.cap_thu_ly||'', NghiepVu: 'Án dân sự', Ngay: item.ngay_thu_ly||'', ThamPhan: item.tham_phan||'', KiemSatVien: item.ksv||'', NoiDung: tomTat, KetQua: item.ket_qua_xet_xu||'', NguoiNhap: item.createdBy||'' });
            });
        }

        // Thi hành án
        if (filteredTha.length && (reportType === 'all' || reportType === 'thi_hanh_an')) {
            filteredTha.forEach(item => {
                const nd = (item.noi_dung_tha || item.noi_dung || '—').substring(0, 70);
                rows += `<tr>
                    <td>${stt++}</td>
                    <td><span class="status-pill" style="background:#dcfce7;color:#15803d">THA</span></td>
                    <td>Thi hành án</td>
                    <td>${item.ngay_nhan_qd||item.ngay_thu_ly||'—'}</td>
                    <td>—</td>
                    <td>${item.ksv||item.createdBy||'—'}</td>
                    <td>${nd}${nd.length===70?'...':''}</td>
                    <td>${item.ket_qua||item.trang_thai||'—'}</td>
                    <td>${item.createdBy||'—'}</td>
                </tr>`;
                exportData.push({ STT: stt-1, LoaiCapXetXu: 'THA', NghiepVu: 'Thi hành án', Ngay: item.ngay_nhan_qd||'', ThamPhan: '—', KiemSatVien: item.ksv||'', NoiDung: nd, KetQua: item.ket_qua||'', NguoiNhap: item.createdBy||'' });
            });
        }

        // Khiếu tố
        if (filteredDkt.length && (reportType === 'all' || reportType === 'don_khieu_to')) {
            filteredDkt.forEach(item => {
                const nd = (item.noi_dung || item.ho_ten || '—').substring(0, 70);
                rows += `<tr>
                    <td>${stt++}</td>
                    <td><span class="status-pill" style="background:#fed7aa;color:#c2410c">KT</span></td>
                    <td>Khiếu nại - Tố cáo</td>
                    <td>${item.ngay_nhan||item.ngay_ghi||'—'}</td>
                    <td>—</td>
                    <td>${item.nguoi_xu_ly||item.createdBy||'—'}</td>
                    <td>${nd}${nd.length===70?'...':''}</td>
                    <td>${item.ket_qua||item.trang_thai||'—'}</td>
                    <td>${item.createdBy||'—'}</td>
                </tr>`;
                exportData.push({ STT: stt-1, LoaiCapXetXu: 'KT', NghiepVu: 'Khiếu nại - Tố cáo', Ngay: item.ngay_nhan||'', ThamPhan: '—', KiemSatVien: item.nguoi_xu_ly||'', NoiDung: nd, KetQua: item.ket_qua||'', NguoiNhap: item.createdBy||'' });
            });
        }

        document.getElementById('record-count').textContent = `${total} hồ sơ`;
        document.getElementById('table-area').innerHTML = total > 0 ? `
            <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>STT</th><th>Cấp/Loại</th><th>Nghiệp vụ</th><th>Ngày</th>
                        <th>Thẩm phán</th><th>KSV</th><th>Nội dung</th><th>Kết quả</th><th>Người nhập</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
            </div>
        ` : `<div class="empty-state">📭 Không có hồ sơ nào trong khoảng thời gian đã chọn.</div>`;
    }

    function buildThaStats(arr) {
        if (!arr.length) return '<div class="summary-row"><span style="color:var(--text-muted)">Không có dữ liệu</span></div>';
        const byStatus = {};
        arr.forEach(x => { const s = x.trang_thai||x.ket_qua||'Đang xử lý'; byStatus[s]=(byStatus[s]||0)+1; });
        return Object.entries(byStatus).map(([k,v])=>`<div class="summary-row"><span>${k}</span><span class="val" style="color:var(--green)">${v}</span></div>`).join('');
    }

    function buildDktStats(arr) {
        if (!arr.length) return '<div class="summary-row"><span style="color:var(--text-muted)">Không có dữ liệu</span></div>';
        const byLoai = {};
        arr.forEach(x => { const s = x.loai_don||x.trang_thai||'Chưa phân loại'; byLoai[s]=(byLoai[s]||0)+1; });
        return Object.entries(byLoai).map(([k,v])=>`<div class="summary-row"><span>${k}</span><span class="val" style="color:var(--orange)">${v}</span></div>`).join('');
    }

    // ===== EXPORT EXCEL =====
    async function exportExcel() {
        if (!allData.an_dan_su.length && !allData.thi_hanh_an.length && !allData.don_khieu_to.length) {
            await loadAllData();
        }
        const reportType = document.getElementById('reportType').value;
        const { from, to } = getTimeRange();
        function vis(arr) {
            return (arr || []).filter(function (item) { return canView(item); });
        }
        if (!window.VksBmds) { alert('Chưa tải bộ xuất mẫu thống kê.'); return; }
        VksBmds.exportReport(reportType, vis(allData.an_dan_su), vis(allData.thi_hanh_an), vis(allData.don_khieu_to), from, to === Infinity ? Date.now() : to);
    }

    // ===== INIT =====
    function applyQueryParams() {
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type');
        const sel = document.getElementById('reportType');
        if (type && sel && sel.querySelector('option[value="' + type + '"]')) {
            sel.value = type;
        }
        const period = params.get('period');
        const psel = document.getElementById('periodType');
        if (period && psel && psel.querySelector('option[value="' + period + '"]')) {
            psel.value = period;
        }
    }

    window.onload = () => {
        if (!checkLogin()) return;
        applyQueryParams();
        toggleCustomDate();
        loadReport();
    };
</script>
</body>
</html>
